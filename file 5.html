<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multiplication Table Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        input, button {
            padding: 8px;
            font-size: 14px;
        }
        #output {
            margin-top: 15px;
            white-space: pre-line; 
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Multiplication Table Generator</h2>

  
    <label for="numberInput">Enter a number:</label>
    <input type="number" id="numberInput" placeholder="e.g., 5">
    <button onclick="printTable()">Generate Table</button>
    <div id="output"></div>

    <script>
       
        function generateTable(num) {
            let table = "";
            for (let i = 1; i <= 10; i++) {
                table += `${num} × ${i} = ${num * i}\n`;
            }
            return table;
        }

        
        function printTable() {
            const numInput = document.getElementById("numberInput").value;
            const outputDiv = document.getElementById("output");

            if (numInput === "" || isNaN(numInput)) {
                outputDiv.textContent = "Please enter a valid number.";
                return;
            }

            const num = Number(numInput);
            outputDiv.textContent = generateTable(num);
        }
    </script>
</body>
</html>
