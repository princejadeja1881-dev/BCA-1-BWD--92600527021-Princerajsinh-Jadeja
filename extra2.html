<head>

</head>
<body>
<div class="movie-card">
    <div class="content">
    </div>

  <style>
    .movie-card {
      width: 300px;
      height: 400px;
      background-image: url(image3.jpg);

      background-position: center;
      background-repeat: no-repeat;
      border-radius: 20px;
    }
    .content {
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      color: white;---
      width: 100%;
      padding: 20px;
    }
  </style>
