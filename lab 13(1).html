<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Grid Table</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">Student Details</h2>

    <div class="row bg-dark text-white p-2">
        <div class="col-4">Name</div>
        <div class="col-4">Course</div>
        <div class="col-4">Marks</div>
    </div>

    <div class="row border p-2">
        <div class="col-4">Rahul</div>
        <div class="col-4">BCA</div>
        <div class="col-4">85</div>
    </div>

    <div class="row border p-2">
        <div class="col-4">Prince</div>
        <div class="col-4">BCA</div>
        <div class="col-4">90</div>
    </div>

    <div class="row border p-2">
        <div class="col-4">Amit</div>
        <div class="col-4">BCA</div>
        <div class="col-4">78</div>
    </div>
</div>

</body>
</html>
